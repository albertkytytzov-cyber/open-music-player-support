server {
    listen 80;
    server_name _;
    root /srv/openmusic-site/current;
    index index.html;
    charset utf-8;
    autoindex off;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","service":"openmusic-site"}';
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:css|png|jpg|jpeg|webp|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
