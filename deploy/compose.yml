services:
  openmusic-site:
    image: nginx:1.27-alpine
    container_name: openmusic-site
    restart: unless-stopped
    volumes:
      - /home/weekend/openmusic-site:/srv/openmusic-site:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - performarc
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

networks:
  performarc:
    external: true
    name: v3final_default
